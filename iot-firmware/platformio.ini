[platformio]
default_envs = esp32dev
core_dir = .local/pio-core

[env]
lib_deps = bblanchon/ArduinoJson@7.4.2
build_flags = -std=gnu++14
build_unflags = -std=gnu++11

; Representative classic ESP32 / 4 MB flash target, NOT a purchased-board claim.
[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
monitor_speed = 115200
build_flags = ${env.build_flags} -I .local -DCORE_DEBUG_LEVEL=0

; Compile-check HTTPS-only policy; still requires verified hardware/security before deployment.
[env:esp32dev_https]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DABANGQUE_PRODUCTION=1

; Host tests never compile main.cpp, access a UART, or open an HTTP socket.
[env:native]
platform = native@1.2.1
platform_packages = platformio/toolchain-gccmingw32@1.50100.0
test_framework = unity
test_build_src = no
test_filter = test_core
extra_scripts = pre:tools/native_toolchain.py
build_flags = ${env.build_flags} -DUNITY_INCLUDE_DOUBLE -DUNITY_SUPPORT_64
